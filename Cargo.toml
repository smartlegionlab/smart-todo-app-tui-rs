[package]
name = "smart-todo-app-tui"
version = "0.1.2"
edition = "2024"
rust-version = "1.88"
license = "BSD-3-Clause"
authors = ["Alexander Suvorov <smartlegionlab@gmail.com>"]
repository = "https://github.com/smartlegionlab/smart-todo-app-tui-rs"
homepage = "https://smartlegionlab.github.io"
description = "A terminal user interface todo application written in Rust"
readme = "README.md"
keywords = ["todo", "tui", "terminal", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4", features = ["derive"] }
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "5"
anyhow = "1"